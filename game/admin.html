<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ZunkoBall · Admin</title>
<link rel="icon" type="image/png" href="logo-icon.png">
<style>
:root { --bg:#0e0e12; --card:#17171f; --line:#2a2a38; --ac:#9b5cff; --gold:#FFB400; --tx:#f2f2f7; --mut:#9a9ab0; --bad:#ff5d5d; --ok:#38d68a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--line); }
header img { height:44px; width:auto; }
header h1 { font-size:18px; margin:0; font-weight:800; }
.badge { margin-left:auto; font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; background:#222232; border:1px solid var(--line); }
.badge.ok { color:var(--ok); border-color:rgba(56,214,138,.5); }
.badge.bad { color:var(--bad); border-color:rgba(255,93,93,.5); }
main { max-width:900px; margin:0 auto; padding:18px; display:grid; gap:18px; }
section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
h2 { margin:0 0 12px; font-size:15px; letter-spacing:.3px; color:var(--gold); text-transform:uppercase; }
input, select, button { font:inherit; color:inherit; }
input[type=search] { width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:#0c0c11; }
input:focus, select:focus { outline:2px solid var(--ac); }
.player { border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; background:#12121a; }
.pl-top { display:flex; align-items:center; gap:10px; }
.av { width:38px; height:38px; border-radius:50%; background:#000; border:3px solid var(--ac); display:grid; place-items:center; font-weight:800; }
.pl-name { font-weight:800; } .pl-user { color:var(--mut); font-size:13px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; min-height:28px; }
.chip { display:inline-flex; align-items:center; gap:6px; background:rgba(255,180,0,.12); border:1px solid rgba(255,180,0,.5); color:var(--gold); padding:4px 6px 4px 10px; border-radius:999px; font-size:13px; font-weight:700; }
.chip button { border:0; background:rgba(255,93,93,.2); color:var(--bad); width:20px; height:20px; border-radius:50%; cursor:pointer; line-height:1; }
.none { color:var(--mut); font-size:13px; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
select { flex:1; min-width:160px; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:#0c0c11; }
.btn { padding:9px 16px; border-radius:10px; border:0; background:linear-gradient(#a56dff,#7a2fff); font-weight:800; cursor:pointer; }
.btn:disabled { opacity:.5; cursor:default; }
.cat { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; }
.cat > div { border:1px solid var(--line); border-radius:12px; padding:12px; background:#12121a; }
.cat b { display:block; } .cat small { color:var(--mut); } .kind { color:var(--ac); font-size:12px; font-weight:700; }
table { width:100%; border-collapse:collapse; font-size:13px; }
td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); } th { color:var(--mut); font-weight:600; }
#msg { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#222232; border:1px solid var(--line); padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; }
#msg.on { opacity:1; } #msg.err { border-color:var(--bad); color:var(--bad); }
.gate { max-width:520px; margin:60px auto; text-align:center; padding:0 18px; }
.gate a { color:var(--ac); }

.tabs { display:flex; gap:8px; flex-wrap:wrap; }
.tab { padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:#12121a; color:var(--mut); font-weight:800; cursor:pointer; }
.tab.on { background:var(--gold); color:#111; border-color:var(--gold); }
.stat { color:var(--mut); font-size:13px; margin:10px 0 0; }
.tag { display:inline-block; font-size:10px; font-weight:900; letter-spacing:.4px; padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; }
.tag.adm { background:rgba(155,92,255,.2); color:#c9a6ff; border:1px solid rgba(155,92,255,.6); }
.tag.me { background:rgba(56,214,138,.15); color:var(--ok); border:1px solid rgba(56,214,138,.5); }
.more { width:100%; margin-top:12px; background:#1d1d29; border:1px solid var(--line); }
.btn.ghost { background:#1d1d29; border:1px solid var(--line); }
.btn.danger { background:rgba(255,93,93,.18); color:var(--bad); border:1px solid rgba(255,93,93,.5); }
.chip.epic { color:#c9a6ff; border-color:rgba(179,136,255,.6); background:rgba(179,136,255,.12); }
.chip.rare { color:#7dd8f5; border-color:rgba(76,201,240,.6); background:rgba(76,201,240,.12); }
.cat .it { border:1px solid var(--line); border-radius:12px; padding:12px; background:#12121a; display:flex; gap:10px; align-items:flex-start; }
.sw { flex:0 0 44px; height:44px; border-radius:50%; border:3px solid #000; box-shadow:0 0 0 1px var(--line); display:grid; place-items:center; font-size:22px; }
.rar { font-size:11px; font-weight:800; margin-left:6px; } .rar.legendary { color:var(--gold); } .rar.epic { color:#c9a6ff; } .rar.rare { color:#7dd8f5; }
.stage { width:100%; height:230px; border-radius:12px; border:1px solid var(--line); display:block; background:#0b2414; margin-bottom:12px; }
.pv { margin-top:8px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:#1d1d29; font-weight:700; cursor:pointer; }
.pv:hover { border-color:var(--gold); }
.cat .it.sel { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
[hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="ZunkoBall">
  <h1>Painel de Admin</h1>
  <span id="backend" class="badge" hidden></span>
</header>
<div id="gate" class="gate">Carregando…</div>
<main id="app" hidden>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="players" type="button">👥 Jogadores</button>
    <button class="tab" data-tab="kits" type="button">👕 Uniformes</button>
    <button class="tab" data-tab="fx" type="button">✨ Efeitos de gol</button>
    <button class="tab" data-tab="audit" type="button">📜 Histórico</button>
  </nav>
  <section data-pane="players">
    <h2>Dar itens a um jogador</h2>
    <input id="q" type="search" placeholder="Buscar por usuário ou nick (vazio = mostra todos)" autocomplete="off">
    <p id="count" class="stat"></p>
    <div id="players"></div>
    <button id="more" class="btn more" type="button" hidden>Carregar mais jogadores</button>
  </section>
  <section data-pane="kits" hidden><h2>Uniformes exclusivos</h2><div id="catKits" class="cat"></div></section>
  <section data-pane="fx" hidden>
    <h2>Efeitos de gol</h2>
    <canvas id="stage" class="stage"></canvas>
    <div id="catFx" class="cat"></div>
  </section>
  <section data-pane="audit" hidden><h2>Histórico</h2><div style="overflow-x:auto"><table><thead><tr><th>Quando</th><th>Admin</th><th>Ação</th><th>Jogador</th><th>Item</th></tr></thead><tbody id="audit"></tbody></table></div></section>
</main>
<div id="msg"></div>
<script src="goalfx.js"></script>
<script src="exclusives.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var catalog = [], names = {}, kindOf = {}, rarityOf = {}, timer = null, me = '', PAGE = 20, loaded = 0, total = 0, fxSel = null;
  function toast(text, err) {
    var m = $('msg'); m.textContent = text; m.className = 'on' + (err ? ' err' : '');
    clearTimeout(toast.t); toast.t = setTimeout(function () { m.className = ''; }, 2800);
  }
  function api(path, body) {
    var opt = { credentials: 'same-origin' };
    if (body) { opt.method = 'POST'; opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
    return fetch(path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Erro ' + r.status); return j; });
    });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function gate(html) { var g = $('gate'); g.hidden = false; $('app').hidden = true; g.textContent = ''; g.appendChild(html); }


  var RAR = { legendary: 'Lendário', epic: 'Épico', rare: 'Raro' };
  var kindLabel = function (k) { return k === 'kit' ? 'uniforme' : 'efeito de gol'; };

  function chipFor(id, p) {
    var c = el('span', 'chip ' + (rarityOf[id] || ''), names[id] || id);
    var x = el('button', null, '×'); x.type = 'button'; x.title = 'Remover item';
    x.addEventListener('click', function () {
      if (!confirm('Remover "' + (names[id] || id) + '" de ' + p.username + '?')) return;
      act('/api/admin/revoke', p.username, id, 'Item removido.');
    });
    c.appendChild(x); return c;
  }
  function renderPlayer(p) {
    var box = el('div', 'player'); box.dataset.user = p.username;
    var top = el('div', 'pl-top');
    top.appendChild(el('div', 'av', p.avatar));
    var who = el('div');
    var nm = el('div', 'pl-name', p.nick);
    if (p.admin) nm.appendChild(el('span', 'tag adm', 'ADMIN'));
    if (p.username === me) nm.appendChild(el('span', 'tag me', 'VOCÊ'));
    who.appendChild(nm);
    who.appendChild(el('div', 'pl-user', '@' + p.username));
    top.appendChild(who); box.appendChild(top);

    var chips = el('div', 'chips');
    if (!p.owned.length) chips.appendChild(el('span', 'none', 'Nenhum item exclusivo ainda.'));
    p.owned.forEach(function (id) { chips.appendChild(chipFor(id, p)); });
    box.appendChild(chips);

    var have = {}; p.owned.forEach(function (id) { have[id] = 1; });
    var free = catalog.filter(function (i) { return !have[i.id]; });
    var row = el('div', 'row');
    var sel = el('select');
    [['kit', 'Uniformes'], ['fx', 'Efeitos de gol']].forEach(function (g) {
      var og = el('optgroup'); og.label = g[1];
      free.filter(function (i) { return i.kind === g[0]; }).forEach(function (i) { var o = el('option', null, i.name); o.value = i.id; og.appendChild(o); });
      if (og.children.length) sel.appendChild(og);
    });
    var btn = el('button', 'btn', 'Dar'); btn.type = 'button';
    if (!free.length) { sel.disabled = btn.disabled = true; sel.appendChild(el('option', null, 'Tem todos os itens')); }
    btn.addEventListener('click', function () { act('/api/admin/grant', p.username, sel.value, 'Item entregue!'); });
    row.appendChild(sel); row.appendChild(btn);
    var all = el('button', 'btn ghost', 'Dar todos'); all.type = 'button'; all.disabled = !free.length;
    all.addEventListener('click', function () {
      if (!confirm('Dar TODOS os ' + free.length + ' itens que faltam para ' + p.username + '?')) return;
      act('/api/admin/grant', p.username, '*', 'Todos os itens entregues!');
    });
    row.appendChild(all);
    if (p.owned.length) {
      var clr = el('button', 'btn danger', 'Remover todos'); clr.type = 'button';
      clr.addEventListener('click', function () {
        if (!confirm('Remover TODOS os itens exclusivos de ' + p.username + '?')) return;
        act('/api/admin/revoke', p.username, '*', 'Itens removidos.');
      });
      row.appendChild(clr);
    }
    box.appendChild(row);
    return box;
  }
  function act(path, username, item, okText) {
    api(path, { username: username, item: item }).then(function () { toast(okText); refreshCard(username); loadAudit(); })
      .catch(function (e) { toast(e.message, true); });
  }
  // atualiza só o cartão mexido (a lista não pula de lugar)
  function refreshCard(username) {
    api('/api/admin/players?u=' + encodeURIComponent(username)).then(function (r) {
      var p = r.players.filter(function (x) { return x.username === username; })[0];
      var old = document.querySelector('.player[data-user="' + username.replace(/"/g, '') + '"]');
      if (p && old) old.parentNode.replaceChild(renderPlayer(p), old);
    }).catch(function () {});
  }
  function updateCount(admins) {
    var q = $('q').value.trim();
    $('count').textContent = (q ? total + ' encontrado(s)' : total + ' jogador(es) no total') + ' · ' + admins + ' admin(s) · mostrando ' + loaded;
    $('more').hidden = loaded >= total;
  }
  // reset=true: recomeça a lista (nova busca); senão carrega a próxima página
  function load(reset) {
    var q = $('q').value.trim(), out = $('players');
    if (reset) { loaded = 0; out.textContent = ''; }
    api('/api/admin/players?q=' + encodeURIComponent(q) + '&offset=' + loaded + '&limit=' + PAGE).then(function (r) {
      if (q !== $('q').value.trim()) return;           // chegou depois de uma busca mais nova
      total = r.total;
      if (!r.total) out.appendChild(el('p', 'none', 'Nenhum jogador encontrado.'));
      r.players.forEach(function (p) { out.appendChild(renderPlayer(p)); });
      loaded += r.players.length;
      updateCount(r.admins);
    }).catch(function (e) { toast(e.message, true); });
  }
  function loadAudit() {
    api('/api/admin/audit').then(function (r) {
      var tb = $('audit'); tb.textContent = '';
      if (!r.audit.length) { var tr = el('tr'); var td = el('td', 'none', 'Sem registros ainda.'); td.colSpan = 5; tr.appendChild(td); tb.appendChild(tr); }
      r.audit.forEach(function (a) {
        var tr = el('tr');
        [new Date(Number(a.at)).toLocaleString('pt-BR'), a.admin, a.action === 'grant' ? 'Deu' : 'Removeu', a.target, names[a.item] || a.item].forEach(function (t) { tr.appendChild(el('td', null, t)); });
        tb.appendChild(tr);
      });
    }).catch(function () {});
  }

  /* ----- abas Uniformes e Efeitos de gol (aparência vem dos mesmos arquivos do jogo) ----- */
  function rarTag(i) { return el('span', 'rar ' + (i.rarity || ''), RAR[i.rarity] || ''); }
  function buildKits() {
    var box = $('catKits'); box.textContent = '';
    catalog.filter(function (i) { return i.kind === 'kit'; }).forEach(function (i) {
      var spec = window.FH_EXCL && FH_EXCL.kitSpec(i.id), card = el('div', 'it');
      var sw = el('div', 'sw');
      if (spec) sw.style.background = 'linear-gradient(135deg,' + spec.base + ' 0 50%,' + spec.accent + ' 50% 100%)';
      var t = el('div'); var b = el('b', null, i.name); b.appendChild(rarTag(i));
      t.appendChild(b); t.appendChild(el('small', null, i.desc));
      card.appendChild(sw); card.appendChild(t); box.appendChild(card);
    });
  }
  function buildFx() {
    var box = $('catFx'); box.textContent = '';
    catalog.filter(function (i) { return i.kind === 'fx'; }).forEach(function (i) {
      var spec = window.FH_EXCL && FH_EXCL.fxSpec(i.id), card = el('div', 'it' + (fxSel === i.id ? ' sel' : ''));
      var sw = el('div', 'sw', spec ? spec.icon : '✨');
      if (spec) sw.style.background = 'linear-gradient(135deg,' + spec.a + ',' + spec.b + ')';
      var t = el('div'); var b = el('b', null, i.name); b.appendChild(rarTag(i));
      t.appendChild(b); t.appendChild(el('small', null, i.desc)); t.appendChild(el('br'));
      var pv = el('button', 'pv', '▶ Ver efeito'); pv.type = 'button';
      pv.addEventListener('click', function () { fxSel = i.id; FH_GOALFX.replay(false); buildFx(); });
      t.appendChild(pv); card.appendChild(sw); card.appendChild(t); box.appendChild(card);
    });
  }
  function stageLoop(ts) {
    requestAnimationFrame(stageLoop);
    var pane = document.querySelector('[data-pane="fx"]');
    if (pane.hidden || !fxSel || !window.FH_GOALFX) return;
    var cv = $('stage'), r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(r.width * d), h = Math.round(r.height * d);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    FH_GOALFX.preview(cv.getContext('2d'), w, h, fxSel, ts);
  }
  function showTab(name) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    document.querySelectorAll('[data-pane]').forEach(function (p) { p.hidden = p.dataset.pane !== name; });
    if (name === 'fx' && !fxSel) { var f = catalog.filter(function (i) { return i.kind === 'fx'; })[0]; if (f) { fxSel = f.id; buildFx(); } }
    if (name === 'audit') loadAudit();
  }

  api('/api/admin/whoami').then(function (me_) {
    if (!me_.admin) {
      var d = el('div'); d.appendChild(el('h2', null, 'Acesso restrito'));
      d.appendChild(el('p', null, 'A conta @' + me_.username + ' não é administradora. Defina ZUNKO_ADMINS no servidor com o nome de usuário.'));
      return gate(d);
    }
    me = me_.username;
    return api('/api/admin/overview').then(function (o) {
      catalog = o.catalog; catalog.forEach(function (i) { names[i.id] = i.name; kindOf[i.id] = i.kind; rarityOf[i.id] = i.rarity; });
      var b = $('backend'); b.hidden = false;
      var db = o.backend === 'mysql' ? 'MySQL' : 'Arquivo JSON';
      b.textContent = o.status === 'ready' ? db + ' · conectado' : db + ' · ' + (o.status === 'offline' ? 'FORA DO AR' : 'iniciando');
      b.className = 'badge ' + (o.status === 'ready' ? 'ok' : 'bad');
      if (o.error) toast(o.error, true);
      buildKits(); buildFx();
      $('gate').hidden = true; $('app').hidden = false;
      $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { load(true); }, 250); });
      $('more').addEventListener('click', function () { load(false); });
      document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
      requestAnimationFrame(stageLoop);
      load(true);
      loadAudit();
    });
  }).catch(function () {
    var d = el('div'); d.appendChild(el('h2', null, 'Entre com sua conta'));
    var p = el('p'); p.appendChild(document.createTextNode('Faça login no jogo com a conta de admin e volte aqui. '));
    var a = el('a', null, 'Abrir o jogo'); a.href = '/'; p.appendChild(a); d.appendChild(p);
    gate(d);
  });
})();
</script>
</body>
</html>
